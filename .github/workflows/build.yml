name: Build APK

on:
  push:
    branches: [arena/83506119-ftpbdapp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Assemble debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -A6 -E '^e: |error: |FAILURE|What went wrong|Execution failed' build.log | head -80 \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -5 build.log
            exit $code
          fi
          tail -5 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ftpmedia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
